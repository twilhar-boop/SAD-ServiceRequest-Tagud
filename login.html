<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — ICT Service Request System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <span class="mark">ICT-SRS</span>
      <h1>ICT Service Request System</h1>
      <p class="sub">Sign in with your issued account to view and manage requests.</p>

      <form id="login-form" novalidate>
        <div class="form-row">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@university.edu" autocomplete="username" required />
        </div>
        <div class="form-row">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" id="login-submit">Log in</button>
      </form>

      <div class="login-msg" id="login-msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
